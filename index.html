<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overworld</title>
<style>
:root{--bg:#0b0b0c;--card:#161616;--ink:#f3ead2;--mute:#a39a82;--line:#2e2818;--accent:#d4af37;--accent2:#f2d675;--hdr:#000;--accent-ink:#1a1405;--warn:#e8a33d;--bad:#ff6b5e;
--c-automatic:#6db3f2;--c-manual:#d4af37;--c-imported:#c3a1f0;--c-estimated:#e8a33d;--c-demo:#ff8a80;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--card:#161616;--ink:#f3ead2;--mute:#a39a82;--line:#2e2818;--accent:#d4af37;--accent2:#f2d675;--hdr:#000;--accent-ink:#1a1405;--warn:#e8a33d;--bad:#ff6b5e;
--c-automatic:#6db3f2;--c-manual:#6cc47a;--c-imported:#c3a1f0;--c-estimated:#f0b04a;--c-demo:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0c;--card:#161616;--ink:#f3ead2;--mute:#a39a82;--line:#2e2818;--accent:#d4af37;--accent2:#f2d675;--hdr:#000;--accent-ink:#1a1405;--warn:#e8a33d;--bad:#ff6b5e;--c-automatic:#6db3f2;--c-manual:#6cc47a;--c-imported:#c3a1f0;--c-estimated:#f0b04a;--c-demo:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:20px;letter-spacing:.3px}header small{color:var(--mute);display:block;font-size:12px}
main{padding:14px 16px;max-width:640px;margin:0 auto}
h2{font-size:18px;margin:18px 0 8px}h3{font-size:16px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.stat{font-size:28px;font-weight:700;line-height:1}.mute{color:var(--mute);font-size:14px}
.chip{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;border:1px solid currentColor;border-radius:99px;padding:1px 8px;margin-left:4px;vertical-align:middle}
.chip.automatic{color:var(--c-automatic)}.chip.manual{color:var(--c-manual)}.chip.imported{color:var(--c-imported)}.chip.estimated{color:var(--c-estimated)}.chip.demo{color:var(--c-demo)}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.dng{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:4px 0 10px}
textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
label{font-size:14px;font-weight:600}
.banner{border:1px dashed var(--c-demo);color:var(--c-demo);border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:14px}
.msg{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px;background:var(--card);border:1px solid var(--accent)}.msg.err{border-color:var(--bad);color:var(--bad)}
ul{padding-left:20px;margin:6px 0}li{margin:4px 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;border:0;background:none;font-size:12px;padding:6px 2px;min-height:48px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}nav button.on{color:var(--accent)}
.tag{font-size:12px;color:var(--warn);font-weight:600}
.cover{width:100%;height:170px;object-fit:cover;border-radius:10px;margin:0 0 8px;display:block}.ph{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px}.ph img{height:80px;border-radius:8px;display:block}
body{background:radial-gradient(900px 320px at 50% -80px,color-mix(in srgb,var(--accent) 16%,transparent),transparent),var(--bg)}
body::before{background:var(--hdr)}
header{background:var(--hdr);color:#fff;border-bottom:0;box-shadow:0 2px 14px rgba(0,0,0,.22)}
header small,#storeflag{color:rgba(255,255,255,.78)}
.card{border-radius:16px;box-shadow:0 1px 3px rgba(10,30,20,.08),0 8px 22px rgba(10,30,20,.07)}
.stat{color:var(--accent);font-size:32px}
h2{display:flex;align-items:center}h2::before{content:"";width:4px;height:16px;border-radius:2px;margin-right:8px;background:linear-gradient(var(--accent),var(--accent2))}
button.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 2px 8px rgba(15,157,138,.3)}
nav{border-top:0;border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.14)}
nav button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:14px;font-weight:700}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
header{border-bottom:1px solid var(--accent)}header b{color:var(--accent);letter-spacing:1.5px;text-transform:uppercase}
button.pri{color:var(--accent-ink);box-shadow:0 2px 12px rgba(212,175,55,.35)}
.card{border-color:var(--line)}nav{background:#0f0f0f;border-top:1px solid var(--line)}
</style></head><body>
<header><div><b>⛏ Overworld</b><small id="sub"></small></div><div id="storeflag" class="mute"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
"use strict";
const SRC=["automatic","manual","imported","estimated"],KEY="overworld:v1",SCHEMA=1;
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"w-"+Date.now().toString(36)+Math.random().toString(36).slice(2,12));
const now=()=>new Date().toISOString();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=i=>{try{return new Date(i).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})}catch(e){return i}};
const chip=s=>`<span class="chip ${esc(s)}">${esc(s)}</span>`;

/* Data layer: adapters share one interface so a CloudAdapter can replace LocalAdapter later.
   Every world carries id, rev and updatedAt for future sync/conflict handling. */
const LocalAdapter={name:"localStorage",
 async load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}},
 async save(s){try{localStorage.setItem(KEY,JSON.stringify(s));return true}catch(e){return false}}};
const Adapter=LocalAdapter;

let form=null;
const noW=()=>`<div class="card"><h3>No active world</h3><p class="mute">Create or select a world first.</p><button class="pri" data-act="go" data-v="worlds">Open Worlds</button></div>`;
const back=t=>`<div class="row" style="margin:0 0 10px"><button data-act="go" data-v="modules">← Modules</button></div><h2 style="margin-top:0">${t}</h2>`;
const dbn=w=>w.demo?`<div class="banner"><b>Demo world.</b> Sample data, not real.</div>`:"";
const srcSel=(id,cur)=>{const o=["manual","estimated"];if(cur&&!o.includes(cur))o.push(cur);return`<select id="${id}">${o.map(s=>`<option ${s===cur?"selected":""}>${s}</option>`).join("")}</select>`};
const dimSel=(id,cur)=>`<select id="${id}">${["Overworld","Nether","The End"].map(s=>`<option ${s===cur?"selected":""}>${s}</option>`).join("")}</select>`;
const num=id=>{const v=parseFloat(val(id));return Number.isFinite(v)?v:null};
const fc=r=>r.x==null?"no coordinates":`${r.x}, ${r.y==null?"?":r.y}, ${r.z}`;
const xyz=(p,o)=>`<label>Coordinates (X, Y, Z)</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><input id="${p}X" type="number" placeholder="X" value="${esc(o.x)}"><input id="${p}Y" type="number" placeholder="Y" value="${esc(o.y)}"><input id="${p}Z" type="number" placeholder="Z" value="${esc(o.z)}"></div>`;
const delBtn=(k,id)=>confirmDel===k+":"+id?`<button class="dng" data-act="delRec" data-k="${k}" data-id="${id}">Confirm delete</button><button data-act="delNo">Keep</button>`:`<button class="dng" data-act="delAsk" data-id="${k}:${id}">Delete</button>`;
const ferrBox=`<div id="ferr" class="msg err" hidden></div>`;
const addBtn=(k,t)=>`<div class="row" style="margin:0 0 10px"><button class="pri" data-act="formOn" data-k="${k}">${t}</button></div>`;
function ferr(t){const e=document.getElementById("ferr");if(e){e.textContent=t;e.hidden=false}}
function upsert(key,fields,what,extra){const w=active(),edit=form&&form.id;let r=edit?w[key].find(x=>x.id===form.id):null;if(r)Object.assign(r,fields);else{r={id:uid(),...extra,...fields};w[key].push(r)}touch(w);log(w,(edit?"Edited ":"Added ")+what+": "+(fields.item||fields.name));form=null;msg={html:"Saved."};commit()}
const phot=r=>{const ps=(r.photos||[]).map((p,i)=>({p,i})).filter(x=>x.p&&typeof x.p.data==='string'&&x.p.data.startsWith('data:image/'));return ps.length?`<img class='cover' alt='${esc(r.name)}' src='${ps[0].p.data}'><div class='ph'>${ps.map(x=>`<span style='position:relative;flex:none'><img alt='' src='${x.p.data}'><button data-act='delPhoto' data-id='${r.id}' data-i='${x.i}' style='position:absolute;top:2px;right:2px;min-height:28px;padding:0 8px'>✕</button></span>`).join('')}</div>`:''};
const photoBtn=r=>`<label class='btn'>+ Photo<input type='file' accept='image/*' data-photo='${r.id}' hidden></label>`;
function addPhoto(id,file){const w=active(),f=w&&w.farms.find(x=>x.id===id);if(!f||!file)return;
 if((f.photos||[]).length>=4){msg={err:1,html:'Up to 4 photos per farm.'};render();return}
 const fr=new FileReader();fr.onerror=()=>{msg={err:1,html:'Could not read that file.'};render()};
 fr.onload=()=>{const img=new Image();img.onerror=()=>{msg={err:1,html:'That file is not a readable image.'};render()};
  img.onload=()=>{const s=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   (f.photos=f.photos||[]).push({id:uid(),at:now(),data:c.toDataURL('image/jpeg',0.7)});touch(w);log(w,'Added a photo to '+f.name);msg={html:'Photo added.'};commit()};
  img.src=fr.result};
 fr.readAsDataURL(file)}
const yv=id=>num(id)==null?null:Math.round(num(id));
const inv=w=>{const t={};w.inventory.forEach(r=>{const k=String(r.item).toLowerCase();t[k]=(t[k]||0)+(+r.qty||0)});return t};
const pdone=p=>(p.checklist||[]).length>0&&p.checklist.every(c=>c.done);
const blockedBy=(w,p)=>(p.deps||[]).map(id=>w.projects.find(x=>x.id===id)).filter(d=>d&&!pdone(d));
const short=(w,p)=>{const t=inv(w);return (p.needs||[]).map(n=>{const h=t[String(n.item).toLowerCase()]||0;return{...n,have:Math.min(h,n.qty),miss:Math.max(0,n.qty-h)}})};
function advise(w){const out=[];
 w.projects.filter(p=>!pdone(p)).forEach(p=>{const bl=blockedBy(w,p),sh=short(w,p),miss=sh.filter(n=>n.miss>0),tot=sh.reduce((a,n)=>a+n.qty,0),have=sh.reduce((a,n)=>a+n.have,0),ready=tot?have/tot:1,pr={high:3,medium:2,low:1}[p.priority]||2,why=[];
  if(bl.length)why.push('Blocked until done: '+bl.map(d=>d.name).join(', '));
  why.push(tot?Math.round(ready*100)+'% of materials already in inventory':'No requirements listed');
  miss.forEach(n=>{const fm=w.farms.flatMap(f=>(f.output||[]).filter(o=>String(o.item).toLowerCase()===String(n.item).toLowerCase()&&o.perHour>0).map(o=>({f,o}))).sort((a,b)=>b.o.perHour-a.o.perHour)[0];
   why.push('Missing '+n.miss+' '+n.item+(fm?' · '+fm.f.name+' measured at '+fm.o.perHour+'/h, roughly '+(Math.round(n.miss/fm.o.perHour*10)/10)+' h to cover (estimate)':' · no measured farm produces it'))});
  out.push({p,blocked:bl.length>0,score:pr*10+ready*10-(bl.length?100:0),why})});
 return out.sort((a,b)=>b.score-a.score)}
const LISTS=["inventory","farms","places","projects","activity"];
function validateWorld(w,i,errs){
 const p="World "+(i+1)+": ";
 if(!w||typeof w!=="object"||Array.isArray(w)){errs.push(p+"not an object");return null}
 if(typeof w.id!=="string"||!w.id||w.id.length>100)errs.push(p+"missing or invalid id");
 if(typeof w.name!=="string"||!w.name.trim()||w.name.length>60)errs.push(p+"name must be 1–60 characters");
 for(const k of LISTS){
  if(w[k]===undefined)continue;
  if(!Array.isArray(w[k])){errs.push(p+k+" must be a list");continue}
  w[k].forEach((r,j)=>{
   if(!r||typeof r!=="object"||Array.isArray(r))errs.push(p+k+"["+j+"] is not an object");
   else if(r.source!==undefined&&!SRC.includes(r.source))errs.push(p+k+"["+j+"] has unknown source label “"+String(r.source).slice(0,20)+"”");
  });
 }
 if(errs.length)return null;
 const o={id:w.id,name:w.name.trim(),seed:String(w.seed??""),notes:String(w.notes??""),demo:w.demo===true,
  source:SRC.includes(w.source)?w.source:"manual",createdAt:w.createdAt||now(),updatedAt:w.updatedAt||now(),rev:Number.isInteger(w.rev)?w.rev:1};
 for(const k of LISTS)o[k]=(w[k]||[]).map(r=>({...r,id:r.id||uid(),source:r.source||"manual"}));
 return o;
}
function validateBundle(text){
 const errs=[];let d;
 try{d=JSON.parse(text)}catch(e){return{errs:["Not valid JSON: "+e.message],worlds:[]}}
 if(!d||typeof d!=="object"||d.app!=="overworld")return{errs:["This is not an Overworld export (missing app: \"overworld\")."],worlds:[]};
 if(!Number.isInteger(d.schemaVersion))return{errs:["Missing schemaVersion."],worlds:[]};
 if(d.schemaVersion>SCHEMA)return{errs:["Export is from a newer schema (v"+d.schemaVersion+"); this app reads v"+SCHEMA+"."],worlds:[]};
 if(!Array.isArray(d.worlds)||!d.worlds.length)return{errs:["worlds must be a non-empty list."],worlds:[]};
 const ws=d.worlds.map((w,i)=>validateWorld(w,i,errs));
 const ids=d.worlds.map(w=>w&&w.id);
 if(new Set(ids).size!==ids.length)errs.push("Duplicate world ids inside the file.");
 return{errs:errs.slice(0,20),worlds:errs.length?[]:ws};
}

let S={schemaVersion:SCHEMA,activeWorldId:null,worlds:[]},storageOk=true,route="home",editing=null,confirmDel=null,msg=null,importPreview=null,exportScope="active";
const active=()=>S.worlds.find(w=>w.id===S.activeWorldId)||null;
const touch=w=>{w.updatedAt=now();w.rev++};
const log=(w,t)=>{w.activity.unshift({id:uid(),at:now(),text:t,source:"manual"});w.activity=w.activity.slice(0,50)};
async function commit(){storageOk=await Adapter.save(S);render()}

function newWorld(name,seed,notes){
 const t=now();return{id:uid(),name,seed,notes,demo:false,source:"manual",createdAt:t,updatedAt:t,rev:1,inventory:[],farms:[],places:[],projects:[],activity:[]};
}
function demoWorld(){
 const w=newWorld("Demo World (sample data)","","Sample data for trying the app. None of it is from a real Minecraft world.");
 w.demo=true;w.source="estimated";
 const r=o=>({id:uid(),source:"estimated",...o});
 w.inventory=[r({item:"Iron Ingot",qty:128,location:"Demo storage room"}),r({item:"Wheat",qty:340,location:"Demo barn chest"}),r({item:"Diamond",qty:9,location:"Demo vault"})];
 w.farms=[r({name:"Demo Wheat Farm",dim:"Overworld",x:120,y:64,z:-45,output:[{item:"Wheat",perHour:600,source:"estimated"}]}),r({name:"Demo Iron Farm",dim:"Overworld",x:-80,y:40,z:200,output:[]})];
 w.places=[r({name:"Demo Spawn",dim:"Overworld",x:0,y:64,z:0,type:"spawn"}),r({name:"Demo Nether Hub",dim:"Nether",x:15,y:70,z:-6,type:"hub"})];
 w.projects=[r({name:"Demo: Expand storage room",priority:"medium",needs:[{item:"Chest",qty:12}],checklist:[{t:"Gather planks",done:true},{t:"Craft chests",done:false}]})];
 log(w,"Demo world created with sample data");return w;
}

/* Basic recommendations: plain rules over saved data, no AI API, nothing invented. */
function tasks(w){
 const t=[];
 if(!w.places.length)t.push("Record your spawn point and base coordinates in the atlas.");
 if(!w.farms.length)t.push("Add the farms you already run, with coordinates.");
 else if(w.farms.some(f=>!(f.output&&f.output.length)))t.push("Measure output for farms that have no production figures yet.");
 if(!w.inventory.length)t.push("Log what is in your main storage so shortages show up.");
 if(!w.projects.length)t.push("Plan a first project with its resource list.");
 else{const open=w.projects.filter(p=>(p.checklist||[]).some(c=>!c.done));if(open.length)t.push("Finish open checklist items on: "+open.map(p=>p.name).join(", ")+".")}
 const ad=advise(w).find(x=>!x.blocked);if(ad)t.unshift('Suggested next project: '+ad.p.name+' (see Advisor).');t.push('Export a JSON backup from the Data tab.');
 return t;
}

const NAV=[["home","⌂","Home"],["worlds","🌍","Worlds"],["modules","▦","Modules"],["data","⇅","Data"],["status","◉","Status"]];
const view={
home(){
 const w=active();
 if(!w)return`<div class="card"><h3>No world yet</h3><p class="mute">Create a world to start tracking. Nothing is pre-filled for you.</p><div class="row"><button class="pri" data-act="go" data-v="worlds">Create a world</button><button data-act="addDemo">Load demo world</button></div></div>`;
 const withOut=w.farms.filter(f=>f.output&&f.output.length);
 return`${w.demo?`<div class="banner"><b>Demo world.</b> Everything here is sample data, not real Minecraft data.</div>`:""}
 <div class="card"><div class="mute">Active world</div><h3>${esc(w.name)} ${w.demo?chip("demo"):chip(w.source)}</h3>
 <div class="mute">Bedrock · Survival · created ${fmt(w.createdAt)}</div>${w.notes?`<p>${esc(w.notes)}</p>`:""}</div>
 <div class="grid"><div class="card"><div class="stat">${w.farms.length}</div><div class="mute">Farms</div></div>
 <div class="card"><div class="stat">${w.inventory.length}</div><div class="mute">Inventory entries</div></div>
 <div class="card"><div class="stat">${w.places.length}</div><div class="mute">Atlas places</div></div>
 <div class="card"><div class="stat">${w.projects.length}</div><div class="mute">Projects</div></div></div>
 <h2>Farm statistics</h2>
 <div class="card">${withOut.length?withOut.map(f=>`<div><b>${esc(f.name)}</b> ${chip(f.source)}<ul>${f.output.map(o=>`<li>${esc(o.item)}: ${esc(o.perHour)}/hour ${chip(o.source||f.source)}</li>`).join("")}</ul></div>`).join(""):`<span class="mute">No production measurements recorded${w.farms.length?"":" and no farms added"} yet.</span>`}</div>
 <h2>Recommended tasks</h2>
 <div class="card"><ul>${tasks(w).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="mute">Rule-based suggestions from your saved data. Project editors arrive with the planner.</div></div>
 <h2>Recent activity</h2>
 <div class="card">${w.activity.length?`<ul>${w.activity.slice(0,5).map(a=>`<li>${esc(a.text)} <span class="mute">· ${fmt(a.at)}</span></li>`).join("")}</ul>`:`<span class="mute">Nothing yet.</span>`}</div>`;
},
worlds(){
 const e=editing&&S.worlds.find(w=>w.id===editing);
 const hasDemo=S.worlds.some(w=>w.demo);
 return`<div class="card"><h3>${e?"Edit world":"Create a world"}</h3>
 <label for="wn">Name</label><input id="wn" maxlength="60" placeholder="My survival world" value="${esc(e?e.name:"")}">
 <label for="ws">Seed (optional)</label><input id="ws" placeholder="Leave blank if unknown" value="${esc(e?e.seed:"")}">
 <label for="wt">Notes (optional)</label><textarea id="wt" style="min-height:70px;font-family:inherit;font-size:16px">${esc(e?e.notes:"")}</textarea>
 <div class="row"><button class="pri" data-act="saveWorld">${e?"Save changes":"Create world"}</button>${e?`<button data-act="cancelEdit">Cancel</button>`:""}</div></div>
 <h2>Your worlds (${S.worlds.length})</h2>
 ${S.worlds.map(w=>`<div class="card"><h3>${esc(w.name)} ${w.demo?chip("demo"):chip(w.source)} ${w.id===S.activeWorldId?`<span class="chip manual">active</span>`:""}</h3>
 <div class="mute">Created ${fmt(w.createdAt)} · rev ${w.rev}</div><div class="mono mute">id ${esc(w.id)}</div>
 <div class="row">${w.id!==S.activeWorldId?`<button class="pri" data-act="activate" data-id="${esc(w.id)}">Set active</button>`:""}

  msg=r.errs.length?{err:1,html:"Import blocked:<ul>"+r.errs.map(e=>"<li>"+esc(e)+"</li>").join("")+"</ul>"}:{html:"Valid: "+r.worlds.map(w=>esc(w.name)).join(", ")+". Tap Import to add."};render()},
 doImport(){
  if(!importPreview)return;const ids=new Set(S.worlds.map(w=>w.id));

 }
